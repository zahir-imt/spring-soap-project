<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QuoteCraft · A better way to win work</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body><header><a class="brand" href="/"><span class="mark">Q</span> QuoteCraft.</a><a href="/">← Back home</a></header><main class="auth"><p class="eyebrow">YOUR NEXT CHAPTER</p><h1>Welcome<br>back.</h1><p class="muted">Your quotes, customers, and jobs are waiting.</p><p class="notice" role="status" th:if="${notice}" th:text="${notice}"></p><p class="error" role="alert" th:if="${error}" th:text="${error}"></p><p class="notice" th:if="${param.created}">Workspace created. Sign in with your new account.</p><p class="error" th:if="${param.error}">Email or password was not accepted.</p><form method="post" th:action="@{/login}" class="card stack"><label>Email<input name="email" type="email" required maxlength="254" autocomplete="username" th:value="${email}"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button">Sign in →</button></form><p>New here? <a href="/signup">Create a workspace</a></p></main><footer><span>QuoteCraft. Made for the work ahead.</span><span>CAD · Toronto time · Preview</span></footer></body></html>
