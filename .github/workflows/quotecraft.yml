name: QuoteCraft checks
on:
  push:
    paths: ['quotecraft/**', '.github/workflows/quotecraft.yml']
  pull_request:
    paths: ['quotecraft/**', '.github/workflows/quotecraft.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: quotecraft/pom.xml
      - name: Build and test
        working-directory: quotecraft
        run: bash mvnw --batch-mode verify
      - name: Packaged HTTP workflow (disposable database)
        working-directory: quotecraft
        run: |
          java -jar target/quotecraft-1.0.0.jar --server.port=8082 '--spring.datasource.url=jdbc:h2:mem:qc-smoke;DB_CLOSE_DELAY=-1' > /tmp/quotecraft-smoke-server.log 2>&1 &
          QC_SMOKE_PID=$!
          trap 'kill "$QC_SMOKE_PID"' EXIT
          python3 scripts/smoke.py
